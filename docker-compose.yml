services:
  mongo:
    image: mongo:7
    container_name: facturacion-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  mailpit:
    image: axllent/mailpit
    container_name: facturacion-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mongo-data:
